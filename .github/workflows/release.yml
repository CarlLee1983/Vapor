name: Release

# 打 v* tag(例如 v0.1.0)時自動觸發,或在 Actions 頁面手動執行。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action 建立 Release 與上傳安裝檔需要寫入 contents 權限。
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 目前只發 macOS。Apple Silicon 與 Intel 各打一份。
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust-targets: 'x86_64-apple-darwin'
          # 之後要跨平台,取消下面註解即可(無需改其他步驟):
          # - platform: 'ubuntu-22.04'
          #   args: ''
          #   rust-targets: ''
          # - platform: 'windows-latest'
          #   args: ''
          #   rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux 專用相依套件(目前 matrix 未啟用,加上跨平台時才會跑)。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag 觸發時才建立 Release;手動執行只編譯不發布。
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Vapor {0}', github.ref_name) || '' }}
          releaseBody: |
            ### 下載
            - Apple Silicon(M 系列):`Vapor_*_aarch64.dmg`
            - Intel:`Vapor_*_x64.dmg`

            ### 首次開啟(macOS)
            Vapor 未經 Apple 公證,第一次開啟會跳「無法驗證開發者」。放行一次即可:
            1. 雙擊 Vapor,跳出提醒先按「完成」
            2. 系統設定 → 隱私權與安全性 → 往下找到「已封鎖 Vapor」→ 按「仍要打開」

            偏好終端機:`xattr -dr com.apple.quarantine /Applications/Vapor.app`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 編譯+發佈後,把 homebrew-tap 的 cask 升到這個版本。
  # 必須放在這裡(而非獨立 workflow):由 GITHUB_TOKEN 自動發佈的 Release
  # 不會觸發 `release: published` 事件,所以無法用事件鏈;改以 needs 串接。
  update-cask:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release DMGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --pattern '*.dmg' --dir dmg

      - name: Compute sha256
        id: sha
        run: |
          v="${{ steps.meta.outputs.version }}"
          echo "arm=$(sha256sum "dmg/Vapor_${v}_aarch64.dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "intel=$(sha256sum "dmg/Vapor_${v}_x64.dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: CarlLee1983/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask file
        env:
          NEW_VERSION: ${{ steps.meta.outputs.version }}
          SHA_ARM: ${{ steps.sha.outputs.arm }}
          SHA_INTEL: ${{ steps.sha.outputs.intel }}
        run: |
          ruby -i -pe '
            $_.sub!(/^(\s*version\s+)".*"/)            { "#{$1}\"#{ENV["NEW_VERSION"]}\"" }
            $_.sub!(/^(\s*sha256 arm:\s+)"[a-f0-9]*"/) { "#{$1}\"#{ENV["SHA_ARM"]}\"" }
            $_.sub!(/^(\s*intel:\s+)"[a-f0-9]*"/)      { "#{$1}\"#{ENV["SHA_INTEL"]}\"" }
          ' tap/Casks/vapor-git.rb
          echo "--- updated cask ---"
          cat tap/Casks/vapor-git.rb

      - name: Commit and push
        run: |
          cd tap
          if git diff --quiet; then
            echo "Cask already up to date — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/vapor-git.rb
          git commit -m "chore: bump vapor-git to ${{ steps.meta.outputs.version }}"
          git push
