name: Release

# 打 v* tag(例如 v0.1.0)時自動觸發,或在 Actions 頁面手動執行。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action 建立 Release 與上傳安裝檔需要寫入 contents 權限。
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 目前只發 macOS。Apple Silicon 與 Intel 各打一份。
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust-targets: 'x86_64-apple-darwin'
          # 之後要跨平台,取消下面註解即可(無需改其他步驟):
          # - platform: 'ubuntu-22.04'
          #   args: ''
          #   rust-targets: ''
          # - platform: 'windows-latest'
          #   args: ''
          #   rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux 專用相依套件(目前 matrix 未啟用,加上跨平台時才會跑)。
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag 觸發時才建立 Release;手動執行只編譯不發布。
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Vapor {0}', github.ref_name) || '' }}
          releaseBody: '請見 CHANGELOG 或 commit 紀錄。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
